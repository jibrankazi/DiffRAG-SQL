name: Trained bounded schema RAG to SQL held-out and original publisher data

on:
  push:
    branches: [main]
    paths:
      - "src/diffragsql/trained_fx_rag_sql.py"
      - "tests/test_trained_fx_rag_sql.py"
      - ".github/workflows/trained-fx-rag-sql.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-benchmark-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scikit-learn pytest
      - name: Fit intent model, check held-out split, safety and SQLite fixture
        run: PYTHONPATH=src pytest -q tests/test_trained_fx_rag_sql.py
      - name: Run real Bank of Canada source retrieval, SQL and independent verification
        run: PYTHONPATH=src python -m diffragsql.trained_fx_rag_sql
      - name: Verify result artifacts and refuse unsupported benchmark claims
        run: |
          python - <<'PY'
          import json, math, sqlite3
          from pathlib import Path
          root=Path("runs/trained_fx_rag_sql")
          evidence=json.loads((root/"evidence.json").read_text())
          assert evidence["all_real_source_sql_cross_checks_passed"]
          assert evidence["original_source_sql_cases"]==4
          assert len(evidence["public_source_body_sha256"])==64
          assert evidence["benchmark"]["training_paraphrases"]==32
          assert evidence["benchmark"]["heldout_paraphrases"]==16
          assert evidence["benchmark"]["heldout_wording_overlap"]==0
          assert not evidence["benchmark"]["cross_database_generalization_tested"]
          with sqlite3.connect(root/"original_source_rates.sqlite3") as db:
              for row in evidence["traces"]:
                  assert row["independent_python_match"]
                  assert db.execute(row["executed_sql"], row["bound_parameters"]).fetchone()[0]==row["actual_sql_answer"]
          print("Passed: trained held-out intent benchmark, real Bank of Canada source and independent SQL replay. Cross-schema SQL generation not claimed.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: measured-heldout-intent-and-authentic-FX-SQL-results
          path: runs/trained_fx_rag_sql/
          if-no-files-found: error
